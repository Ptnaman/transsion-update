name: Transsion OTA Telegram Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      notify_existing:
        description: 'Send Telegram notifications for already-known OTA entries'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: transsion-ota-telegram
  cancel-in-progress: false

jobs:
  check-ota:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout monitor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone OTA prober
        run: git clone --depth 1 --branch master https://github.com/ramabondanp/transsion-ota-prober.git ota-prober

      - name: Set Tecno Naman Telegram branding
        run: |
          sed -i 's#https://t.me/TranssionUpdatesTracker#https://t.me/tecnonamanupdate#g' ota-prober/checkota/telegram.py
          sed -i 's#TRANSSION Updates Tracker#Tecno Naman#g' ota-prober/checkota/telegram.py
          grep -n -E 'author_name|author_url' ota-prober/checkota/telegram.py

      - name: Restore processed OTA state
        run: |
          if [ -f data/ota_processed_updates.txt ]; then
            cp data/ota_processed_updates.txt ota-prober/processed_updates.txt
          fi

      - name: Install OTA prober
        run: python -m pip install -e ./ota-prober

      - name: Check Transsion OTAs and notify Telegram
        env:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          telegraph_token: ${{ secrets.TELEGRAPH_TOKEN }}
          NOTIFY_EXISTING: ${{ inputs.notify_existing || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${bot_token}" ] || [ -z "${chat_id}" ]; then
            echo "BOT_TOKEN and CHAT_ID GitHub Actions secrets are required."
            exit 1
          fi

          check_status=0
          set +e

          if [ ! -s ota-prober/processed_updates.txt ] && [ "${NOTIFY_EXISTING}" != "true" ]; then
            echo "No previous OTA state found; registering a silent baseline."
            (
              cd ota-prober
              checkota -d configs/ --jobs 4 --timeout 2400 --register-update
            ) 2>&1 | tee ota-check.log
            check_status=${PIPESTATUS[0]}
          else
            (
              cd ota-prober
              checkota -d configs/ --jobs 4 --timeout 2400
            ) 2>&1 | tee ota-check.log
            check_status=${PIPESTATUS[0]}
          fi

          set -e

          if [ "${check_status}" -eq 124 ]; then
            echo "OTA prober reached its wall-clock timeout. Partial processed state will be persisted so already-processed updates are not sent again."
          elif [ "${check_status}" -ne 0 ]; then
            echo "OTA prober failed with exit code ${check_status}."
            exit "${check_status}"
          fi

      - name: Persist processed OTA state
        if: always()
        run: |
          if [ -f ota-prober/processed_updates.txt ]; then
            mkdir -p data
            cp ota-prober/processed_updates.txt data/ota_processed_updates.txt
          fi

      - name: Commit updated OTA state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/ota_processed_updates.txt; then
            echo "No OTA state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ota_processed_updates.txt
          git commit -m "Update Transsion OTA notification state"
          git push

      - name: Upload OTA check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-check-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: ota-prober/ota-check.log
